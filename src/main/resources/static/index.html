<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OD Management System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar navbar-dark bg-primary shadow">

        <div class="container-fluid">
    
            <span class="navbar-brand mb-0 h1">
                OD Management System
            </span>
    
        </div>

        <button
            class="btn btn-light"
            onclick="logout()">
                    Logout
        </button>
    
    </nav>

    <div class="container mt-3">

        <div class="alert alert-info">
    
            Logged in as:
            <strong id="userRole"></strong>
    
        </div>
    
    </div>

    <div class="container mt-5">

        <div class="row mb-4">

            <div class="col-md-4">
        
                <div class="card shadow dashboard-card bg-primary text-white">
        
                    <div class="card-body">
        
                        <h5>Total Requests</h5>
        
                        <h2 id="totalCount">0</h2>
        
                    </div>
        
                </div>
        
            </div>
        
            <div class="col-md-4">
        
                <div class="card shadow dashboard-card bg-success text-white">
        
                    <div class="card-body">
        
                        <h5>Approved</h5>
        
                        <h2 id="approvedCount">0</h2>
        
                    </div>
        
                </div>
        
            </div>
        
            <div class="col-md-4">
        
                <div class="card shadow dashboard-card bg-danger text-white">
        
                    <div class="card-body">
        
                        <h5>Rejected</h5>
        
                        <h2 id="rejectedCount">0</h2>
        
                    </div>
        
                </div>
        
            </div>
        
        </div>

        <h1 class="text-center mb-4">On Duty Management System</h1>

        <!-- OD FORM -->

        <div class="card shadow p-4 mb-5" id="applyForm">

            <h3>Apply OD</h3>

            <input type="text" id="name" class="form-control mb-3" placeholder="Student Name">

            <input type="text" id="reg" class="form-control mb-3" placeholder="Register Number">

            <input type="text" id="reason" class="form-control mb-3" placeholder="Reason">

            <button class="btn btn-primary" onclick="applyOD()">
                Submit OD
            </button>

        </div>

        <!-- REQUEST TABLE -->

        <div class="card shadow p-4">

            <h3>OD Requests</h3>

            <table class="table table-bordered mt-3">

                <thead class="table-dark">
                    <tr>
                        <th>ID</th>
                        <th>Name</th>
                        <th>Register No</th>
                        <th>Reason</th>
                        <th>Status</th>
                        <th>Actions</th>
                        <th>Select Option</th>
                    </tr>
                </thead>

                <tbody id="tableBody">

                </tbody>

            </table>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
